# Rebuilds liquidlyf.github.io every 1 January, so the footer's copyright year moves to the new
# year even if nothing else was published. The year comes from Jekyll's build time (site.time in
# _layouts/default.html), so every publish updates it too.
#
# Generated by docs/website-drafts/build_site.py in the app repo; edit it there, not here.
#
# It only asks GitHub Pages to build the main branch again: no checkout, no commit, no secrets.
# It uses the repo's own GITHUB_TOKEN, allowed to do nothing but request a Pages build.
#
# GitHub switches off scheduled workflows in a public repo after 60 days without activity. To
# switch it on again: Actions → "Yearly rebuild" → Enable workflow. In January, check the footer:
# if it still shows last year, Actions → "Yearly rebuild" → Run workflow.
name: Yearly rebuild

on:
  schedule:
    - cron: "17 0 1 1 *" # 1 January, 00:17 UTC (06:17 in Dhaka)
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask GitHub Pages to build the site again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$REPO/pages/builds"
